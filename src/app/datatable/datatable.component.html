<div class="table">
  <div class="grid-container">
    <div class="grid-column col-1"></div>
    <div class="grid-column col-2">Id</div>
    <div class="grid-column col-2">Firstname</div>
    <div class="grid-column col-2">Lastname</div>
    <div class="grid-column col-2">Status</div>
    <div class="grid-column col-2">Action</div>
    <div class="grid-column col-1"></div>
  </div>
  @for (row of rows; track $index) {
  <div class="grid-container">
    <div class="grid-column col-1"></div>
    <div class="grid-column col-2">{{ $index + 1 }}</div>
    <div class="grid-column col-2">{{ row.firstname }}</div>
    <div class="grid-column col-2">{{ row.lastname }}</div>
    <div class="grid-column col-2">{{ row.status }}</div>
    <div class="grid-column col-2">
      <a (click)="editUser(row)">Edit</a>&nbsp;&nbsp;&nbsp;<a
        (click)="deleteUser(row)"
        >Delete</a
      >
    </div>
    <div class="grid-column col-1"></div>
  </div>
  }
</div>
